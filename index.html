<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELLOS POS</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  background:#f3f4f6;
  color:#111;
}

header{
  background:#111;
  color:white;
  padding:18px 24px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.logo{
  font-size:26px;
  font-weight:800;
  letter-spacing:2px;
}

.status{
  font-size:13px;
  opacity:.8;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.grid{
  display:grid;
  grid-template-columns:1.5fr 1fr;
  gap:20px;
}

.card{
  background:white;
  border-radius:14px;
  padding:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

h2{
  margin-bottom:18px;
  font-size:20px;
}

.form-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

label{
  font-size:13px;
  font-weight:bold;
  display:block;
  margin-bottom:5px;
}

input,select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:8px;
  font-size:15px;
}

button{
  border:0;
  border-radius:8px;
  padding:12px 16px;
  cursor:pointer;
  font-weight:bold;
}

.btn-black{
  background:#111;
  color:white;
}

.btn-gray{
  background:#e5e7eb;
  color:#111;
}

.btn-danger{
  background:#dc2626;
  color:white;
}

.products{
  margin-top:20px;
}

.product{
  border:1px solid #e5e7eb;
  border-radius:10px;
  padding:14px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.product-info strong{
  display:block;
  margin-bottom:5px;
}

.product-info small{
  color:#666;
}

.price{
  font-weight:bold;
}

.cart-item{
  display:flex;
  justify-content:space-between;
  border-bottom:1px solid #eee;
  padding:12px 0;
}

.cart-item:last-child{
  border-bottom:0;
}

.cart-total{
  margin-top:20px;
  border-top:2px solid #111;
  padding-top:15px;
}

.total-row{
  display:flex;
  justify-content:space-between;
  margin:8px 0;
}

.total-final{
  font-size:25px;
  font-weight:800;
}

.empty{
  text-align:center;
  color:#777;
  padding:30px 10px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.actions button{
  flex:1;
}

@media(max-width:800px){
  .grid{
    grid-template-columns:1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  header{
    padding:15px;
  }

  .container{
    padding:12px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">ELLOS POS</div>
  <div class="status">Punto de venta</div>
</header>

<div class="container">

<div class="grid">

<!-- PRODUCTOS -->
<div class="card">

<h2>Registrar producto</h2>

<div class="form-grid">

<div>
<label>Producto</label>
<input id="producto" type="text" placeholder="Ej. Camisa Sport">
</div>

<div>
<label>Precio de venta</label>
<input id="precio" type="number" placeholder="0">
</div>

<div>
<label>Talla</label>
<select id="talla">
<option value="">Seleccionar</option>
<option>XS</option>
<option>S</option>
<option>M</option>
<option>L</option>
<option>XL</option>
<option>XXL</option>
<option>28</option>
<option>30</option>
<option>32</option>
<option>34</option>
<option>36</option>
<option>38</option>
<option>40</option>
</select>
</div>

<div>
<label>Color</label>
<input id="color" type="text" placeholder="Ej. Blanco">
</div>

<div>
<label>Existencia</label>
<input id="existencia" type="number" placeholder="0">
</div>

</div>

<div class="actions">
<button class="btn-black" onclick="agregarProducto()">
Agregar producto
</button>
</div>

<div class="products">

<h2>Productos</h2>

<div id="listaProductos">
<div class="empty">
No hay productos registrados.
</div>
</div>

</div>

</div>


<!-- VENTA -->
<div class="card">

<h2>Venta</h2>

<div id="carrito">
<div class="empty">
El carrito está vacío.
</div>
</div>

<div class="cart-total">

<div class="total-row">
<span>Subtotal</span>
<strong id="subtotal">C$ 0.00</strong>
</div>

<div class="total-row">
<span>Descuento</span>
<strong>C$ 0.00</strong>
</div>

<div class="total-row total-final">
<span>TOTAL</span>
<strong id="total">C$ 0.00</strong>
</div>

<div class="actions">
<button class="btn-gray" onclick="vaciarCarrito()">
Vaciar
</button>

<button class="btn-black" onclick="prepararTicket()">
Generar ticket
</button>
</div>

</div>

</div>

</div>

</div>


<script>

let productos = [];
let carrito = [];


/* AGREGAR PRODUCTO */

function agregarProducto(){

  const nombre = document.getElementById("producto").value.trim();
  const precio = Number(document.getElementById("precio").value);
  const talla = document.getElementById("talla").value;
  const color = document.getElementById("color").value.trim();
  const existencia = Number(document.getElementById("existencia").value);

  if(!nombre){
    alert("Escribe el nombre del producto.");
    return;
  }

  if(precio <= 0){
    alert("Ingresa un precio válido.");
    return;
  }

  if(!talla){
    alert("Selecciona una talla.");
    return;
  }

  if(existencia <= 0){
    alert("Ingresa la existencia.");
    return;
  }

  const producto = {
    id: Date.now(),
    nombre,
    precio,
    talla,
    color,
    existencia
  };

  productos.push(producto);

  guardarDatos();
  mostrarProductos();

  document.getElementById("producto").value="";
  document.getElementById("precio").value="";
  document.getElementById("talla").value="";
  document.getElementById("color").value="";
  document.getElementById("existencia").value="";
}


/* MOSTRAR PRODUCTOS */

function mostrarProductos(){

  const contenedor = document.getElementById("listaProductos");

  if(productos.length === 0){

    contenedor.innerHTML =
      '<div class="empty">No hay productos registrados.</div>';

    return;
  }

  contenedor.innerHTML = "";

  productos.forEach(producto => {

    const div = document.createElement("div");

    div.className = "product";

    div.innerHTML = `
      <div class="product-info">
        <strong>${producto.nombre}</strong>
        <small>
          Talla: ${producto.talla}
          ${producto.color ? " | Color: " + producto.color : ""}
          | Stock: ${producto.existencia}
        </small>
      </div>

      <div>
        <div class="price">
          C$ ${producto.precio.toFixed(2)}
        </div>

        <button
          class="btn-black"
          onclick="agregarCarrito(${producto.id})">
          Vender
        </button>
      </div>
    `;

    contenedor.appendChild(div);

  });
}


/* AGREGAR AL CARRITO */

function agregarCarrito(id){

  const producto = productos.find(p => p.id === id);

  if(!producto){
    return;
  }

  if(producto.existencia <= 0){
    alert("Este producto no tiene existencia.");
    return;
  }

  const existente = carrito.find(item => item.id === id);

  if(existente){

    if(existente.cantidad >= producto.existencia){
      alert("No hay más existencia disponible.");
      return;
    }

    existente.cantidad++;

  }else{

    carrito.push({
      ...producto,
      cantidad:1
    });

  }

  actualizarCarrito();
}


/* ACTUALIZAR CARRITO */

function actualizarCarrito(){

  const contenedor = document.getElementById("carrito");

  if(carrito.length === 0){

    contenedor.innerHTML =
      '<div class="empty">El carrito está vacío.</div>';

    actualizarTotales();

    return;
  }

  contenedor.innerHTML = "";

  carrito.forEach(item => {

    const div = document.createElement("div");

    div.className = "cart-item";

    const totalItem = item.precio * item.cantidad;

    div.innerHTML = `

      <div>
        <strong>${item.nombre}</strong>
        <br>
        <small>
          ${item.talla}
          ${item.color ? " | " + item.color : ""}
          <br>
          Cantidad: ${item.cantidad}
        </small>
      </div>

      <div style="text-align:right">

        <strong>
          C$ ${totalItem.toFixed(2)}
        </strong>

        <br>

        <button
          class="btn-danger"
          style="margin-top:5px;padding:6px 10px"
          onclick="quitarDelCarrito(${item.id})">
          Quitar
        </button>

      </div>

    `;

    contenedor.appendChild(div);

  });

  actualizarTotales();
}


/* QUITAR DEL CARRITO */

function quitarDelCarrito(id){

  carrito = carrito.filter(item => item.id !== id);

  actualizarCarrito();
}


/* TOTALES */

function actualizarTotales(){

  let subtotal = 0;

  carrito.forEach(item => {
    subtotal += item.precio * item.cantidad;
  });

  document.getElementById("subtotal").textContent =
    "C$ " + subtotal.toFixed(2);

  document.getElementById("total").textContent =
    "C$ " + subtotal.toFixed(2);
}


/* VACIAR */

function vaciarCarrito(){

  carrito = [];

  actualizarCarrito();
}


/* GENERAR TICKET */

function prepararTicket(){

  if(carrito.length === 0){
    alert("El carrito está vacío.");
    return;
  }

  alert(
    "Venta preparada correctamente.\n\n" +
    "El siguiente módulo será el ticket " +
    "optimizado para impresora térmica de 80 mm."
  );
}


/* GUARDAR */

function guardarDatos(){

  localStorage.setItem(
    "ellos_pos_productos",
    JSON.stringify(productos)
  );

}


/* CARGAR */

function cargarDatos(){

  const datos =
    localStorage.getItem("ellos_pos_productos");

  if(datos){

    productos = JSON.parse(datos);

  }

  mostrarProductos();
  actualizarCarrito();

}


/* INICIO */

cargarDatos();

</script>

</body>
</html>
